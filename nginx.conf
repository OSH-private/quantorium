server {
    listen 80;
    server_name game.cnfro52.ru www.game.cnfro52.ru;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|mp3|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
